<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LeafOS Packager 解包器</title>
<style>
:root{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:#222;background:#f7f7f7;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:28px 16px;background:linear-gradient(180deg,#eaf5ff 0,#f7f7f7 260px)}
main{width:min(625px,100%);margin:24px auto;padding:24px;border-radius:6px;background:#fff;border-top:6px solid #14a0ff;box-shadow:0 2px .5em .1em rgba(0,0,0,.14)}
h1{margin:0 0 8px;font-size:clamp(25px,5vw,34px);color:#222}
p{color:#555;line-height:1.65}
.drop{display:block;margin:24px 0 16px;padding:34px 20px;text-align:center;border:2px dashed #9bcdf2;border-radius:5px;background:#f2f9ff;cursor:pointer;transition:background .15s,border-color .15s}
.drop:hover,.drop:focus-within{border-color:#14a0ff;background:#e8f5ff}
input{display:none}
button,.tool-link{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:4px;padding:10px 18px;background:#14a0ff;color:white;text-decoration:none;font:700 14px inherit;font-weight:700;cursor:pointer;transition:filter .12s}
button:hover,.tool-link:hover{filter:brightness(1.08)}
button:disabled{opacity:.45;cursor:wait}
.status{min-height:48px;margin:18px 0 0;padding:12px;border-radius:4px;background:#f1f5f9;color:#34445a;white-space:pre-wrap;overflow-wrap:anywhere;border-left:4px solid #14a0ff}
small{color:#78889a}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.nav{display:flex;gap:16px;flex-wrap:wrap;margin-top:20px;padding-top:14px;border-top:1px solid #e5e9ef;font-size:14px}
a{color:#087fc9}
@media(prefers-color-scheme:dark){:root{color:#eee;background:#111;color-scheme:dark}body{background:linear-gradient(180deg,#17283b 0,#111 260px)}main{background:#222;border-top-color:#14a0ff}h1{color:#f4f7fb}p{color:#c2cad5}.drop{background:#192a3a;border-color:#41627e}.drop:hover{background:#20364a;border-color:#62baff}.status{background:#171d27;color:#d6e4f6;border-left-color:#14a0ff}small{color:#9aa9bb}.nav{border-color:#3a414d}a{color:#69c2ff}}
</style></head><body><header><div class="brand"><span>LeafOS</span> Packager</div><nav><a href="../">返回打包器</a><a href="../terms-of-use.html" target="_blank" rel="noopener noreferrer">使用条款</a></nav></header><main><h1>LeafOS 解包器</h1><p>支持 LeafOS Packager、TurboWarp Packager、forkphorus 和 HTMLifier 生成的 HTML 或 ZIP 文件，提取原始 Scratch 项目（SB、SB2、SB3）。解包过程在当前浏览器本地完成，文件不会上传到服务器。</p><label class="drop" for="file"><strong>选择文件，或将打包文件拖到这里</strong><br><small>支持 HTML、HTM 和 ZIP 格式</small></label><input id="file" type="file" accept=".html,.htm,.zip,application/zip,text/html"><div class="row"><button id="go" disabled>开始解包</button><small id="name">尚未选择文件</small></div><div id="status" class="status" role="status">等待文件…</div><p class="note">兼容性说明：TurboWarp 官方解包核心按 MPL-2.0 许可集成，并保留 LeafOS 自定义格式的解密支持。若打包时选择了 ZIP，请提供完整 ZIP 文件；单独的 HTML 可能不包含项目数据。</p></main>
<script src="./dependencies/jszip.min.js"></script><script src="./unpackager.js"></script><script>
const fileInput=document.querySelector('#file'),go=document.querySelector('#go'),status=document.querySelector('#status'),nameEl=document.querySelector('#name');let selected=null;const say=s=>status.textContent=s;
fileInput.addEventListener('change',()=>{selected=fileInput.files[0]||null;go.disabled=!selected;nameEl.textContent=selected?selected.name:'尚未选择文件';say(selected?'文件已就绪。':'等待文件…')});document.querySelector('.drop').addEventListener('dragover',e=>e.preventDefault());document.querySelector('.drop').addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f){selected=f;go.disabled=false;nameEl.textContent=f.name;say('文件已就绪。')}});
function getKey(html){const m=html.match(/(?:var|let|const)\s+zxKey\s*=\s*(\[[^\]]*\]|null)\s*;/);if(!m||m[1]==='null')return null;const a=JSON.parse(m[1]);if(!Array.isArray(a)||!a.length)throw Error('密钥格式不正确');return a.map(x=>Number(x)>>>0)}
function step(s){s^=s<<13;s^=s>>>17;s^=s<<5;return s>>>0}function decrypt(bytes,key,index){if(!key)return bytes;let state=(key[0]^Math.imul(index+1,0x9e3779b1))>>>0;if(!state)state=0x6d2b79f5;const words=bytes.length>>>2,view=new DataView(bytes.buffer,bytes.byteOffset,words*4);for(let i=0;i<words;i++){state=step(state);view.setUint32(i*4,view.getUint32(i*4,true)^state,true)}if(bytes.length>words*4){state=step(state);for(let i=words*4;i<bytes.length;i++){bytes[i]^=state&255;state>>>=8}}return bytes}
function decode85(str,size){if(str.length%5!==0)throw Error('Base85 数据长度异常');const out=new Uint8Array(Math.ceil(size/4)*4),view=new DataView(out.buffer);for(let i=0,j=0;i<str.length;i+=5,j+=4){const v=c=>{let n=str.charCodeAt(c);if(n===40)n=60;if(n===41)n=62;return n-42};const n=v(i)+v(i+1)*85+v(i+2)*7225+v(i+3)*614125+v(i+4)*52200625;view.setUint32(j,n>>>0,true)}return out.subarray(0,size)}
async function fromLeafHtml(file){const html=await file.text(),key=getKey(html),re=/<script\b(?=[^>]*\bdata="([^"]*)")[^>]*>\s*decodeChunk\((\d+)\s*,\s*(\d+)\)\s*<\/script>/g;let m,chunks=[];while((m=re.exec(html))!==null)chunks.push({data:m[1],size:Number(m[2]),index:Number(m[3])});if(!chunks.length)throw Error("没有找到 LeafOS 项目数据块。");chunks.sort((a,b)=>a.index-b.index);const total=chunks.reduce((n,c)=>n+c.size,0),out=new Uint8Array(total);let offset=0;for(const c of chunks){const part=decode85(c.data,c.size);decrypt(part,key,c.index);out.set(part,offset);offset+=part.length}return out}
async function fromZip(file){if(!window.JSZip)throw Error('ZIP 解压组件加载失败，请检查网络后重试。');const zip=await JSZip.loadAsync(file),entry=zip.file('index.html')||Object.values(zip.files).find(x=>!x.dir&&x.name.endsWith('/index.html')),data=zip.file('project.dat')||Object.values(zip.files).find(x=>!x.dir&&x.name.endsWith('/project.dat'));if(!entry||!data)throw Error('ZIP 中找不到 index.html 或 project.dat。');const html=await entry.async('string'),key=getKey(html),bytes=await data.async('uint8array');return decrypt(bytes,key,0)}
async function extractProject(file){
 if(typeof window.JSZip==='undefined')throw Error('JSZip 依赖未加载，请刷新页面或检查本地文件是否完整。');
 if(typeof window.unpackage!=='function')throw Error('官方解包核心未加载，请刷新页面或检查 unpackager.js 是否存在。');
 const ext=file.name.toLowerCase().split('.').pop();
 if(ext==='zip'||file.type==='application/zip'){
  try{return {type:'sb3',data:await fromZip(file)}}catch(leafError){return await unpackage(file)}
 }
 const text=await file.text();
 if(/(?:var|let|const)\s+zxKey\s*=/.test(text)||/<script\b(?=[^>]*\bdata="[^"]*")[^>]*>\s*decodeChunk\(\d+\s*,\s*\d+\)/.test(text)){
  return {type:'sb3',data:await fromLeafHtml(file)}
 }
 return await unpackage(file)
}
go.addEventListener('click',async()=>{if(!selected)return;go.disabled=true;say('正在分析文件…');try{const result=await extractProject(selected),type=result.type||'sb3',bytes=result.data instanceof Uint8Array?result.data:new Uint8Array(result.data);if(bytes.length<8)throw Error('提取的数据过短，文件可能损坏。');const blob=new Blob([bytes],{type:type==='sb'?'application/octet-stream':'application/x.scratch.'+type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=selected.name.replace(/\.(html?|zip)$/i,'')+'.'+type;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);say('解包完成！已导出 '+a.download+'（'+(bytes.length/1024/1024).toFixed(2)+' MB）')}catch(e){say('解包失败：'+(e&&e.message||e))}finally{go.disabled=false}});
</script></body></html>

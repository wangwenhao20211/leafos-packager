name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'webpack.config.js'
      - 'src/**'
      - 'static/**'
      - 'scratch-vm.tar.gz'
      - 'unpacker/**'
      - 'terms-of-use.html'

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build website
        run: |
          mkdir -p web
          npm run build-prod
          cp -r dist/* web/
        env:
          ENABLE_SERVICE_WORKER: "1"
      - name: Build standalone
        run: |
          npm run build-standalone-prod
          cp dist/standalone.html web/
      - name: Add unpacker and terms
        run: |
          mkdir -p web/unpacker
          cp unpacker/index.html web/unpacker/index.html
          cp unpacker/unpackager.js web/unpacker/unpackager.js
          cp static/terms-of-use.html web/terms-of-use.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

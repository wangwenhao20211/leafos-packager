name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build website
        run: |
          mkdir -p web
          npm run build-prod
          cp -r dist/* web/
        env:
          ENABLE_SERVICE_WORKER: "1"
      - name: Build standalone
        run: |
          npm run build-standalone-prod
          cp dist/standalone.html web/
      - name: Add unpacker
        run: |
          mkdir -p web/unpacker
          cp unpacker/index.html web/unpacker/index.html
          cp unpacker/unpackager.js web/unpacker/unpackager.js
      - name: Add custom domain
        run: cp CNAME web/CNAME
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Import source archive and deploy

on:
  push:
    branches: [main]
    paths:
      - 'leafos-packager-ready.zip'
      - '.github/workflows/import-source.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: import-source
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Extract source archive
        run: |
          python3 - <<'PY'
          import pathlib
          import zipfile

          archive = pathlib.Path("leafos-packager-ready.zip")
          if not archive.is_file():
              raise SystemExit("Upload leafos-packager-ready.zip to the repository root first.")

          root = pathlib.Path.cwd().resolve()
          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  name = item.filename.replace("\\", "/")
                  parts = pathlib.PurePosixPath(name).parts
                  if not parts or name.startswith("/") or ".." in parts:
                      raise SystemExit(f"Unsafe archive path: {item.filename}")
                  # Keep this repository's deployment/import workflows intact.
                  if len(parts) >= 2 and parts[0] == ".github" and parts[1] == "workflows":
                      continue
                  target = (root / pathlib.Path(*parts)).resolve()
                  if root not in target.parents and target != root:
                      raise SystemExit(f"Unsafe archive path: {item.filename}")
                  if item.is_dir() or name.endswith("/"):
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with z.open(item) as source, target.open("wb") as output:
                          output.write(source.read())

          archive.unlink()
          PY

      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to import."
            exit 0
          fi
          git commit -m "Import complete LeafOS Packager source"
          git push origin HEAD:main

  build:
    needs: import
    runs-on: ubuntu-latest
    steps:
      - name: Checkout imported source
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build website
        run: |
          mkdir -p web
          npm run build-prod
          cp -r dist/* web/
        env:
          ENABLE_SERVICE_WORKER: "1"
      - name: Build standalone
        run: |
          npm run build-standalone-prod
          cp dist/standalone.html web/
      - name: Add unpacker
        run: |
          mkdir -p web/unpacker
          cp unpacker/index.html web/unpacker/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

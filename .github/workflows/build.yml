name: Build

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'webpack.config.js'
      - 'src/**'
      - 'static/**'
      - 'scratch-vm.tar.gz'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'webpack.config.js'
      - 'src/**'
      - 'static/**'
      - 'scratch-vm.tar.gz'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Build standalone
        run: npm run build-standalone-prod
      - name: Upload standalone artifact
        uses: actions/upload-artifact@v6
        with:
          name: standalone
          path: dist/standalone.html
